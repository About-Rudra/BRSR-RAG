<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BRSR Neural Console</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #11162a;
      --accent: #4fd1ff;
      --text: #e6e8f0;
      --muted: #8a90b8;
      --glow: 0 0 20px rgba(79, 209, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #131a33, var(--bg));
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 900px;
      max-width: 95%;
      background: linear-gradient(180deg, #0f1530, var(--panel));
      border-radius: 16px;
      box-shadow: var(--glow);
      padding: 24px 28px 30px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .orb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: var(--glow);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
    }

    textarea {
      width: 100%;
      height: 90px;
      resize: none;
      border-radius: 12px;
      border: 1px solid rgba(79, 209, 255, 0.2);
      background: #070b18;
      color: var(--text);
      padding: 14px;
      font-size: 14px;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: var(--glow);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    button {
      background: linear-gradient(135deg, #4fd1ff, #7aa2ff);
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.1);
    }

    .output {
      margin-top: 22px;
      background: #070b18;
      border-radius: 12px;
      padding: 16px;
      min-height: 120px;
      white-space: pre-wrap;
      line-height: 1.5;
      border: 1px solid rgba(79, 209, 255, 0.15);
    }

    .thinking {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="orb"></div>
      <h1>BRSR Neural Console</h1>
      <div class="subtitle">retrieval-augmented system</div>
    </div>

    <textarea id="query" placeholder="Ask about Scope 3 disclosures, SEBI requirements, ESG reporting…"></textarea>

    <div class="actions">
      <button onclick="ask()">Query</button>
    </div>

    <div id="output" class="output thinking">
      Awaiting input…
    </div>
  </div>

  <script>
    async function ask() {
      const q = document.getElementById("query").value.trim();
      const out = document.getElementById("output");

      if (!q) return;

      out.textContent = "Processing query through knowledge base…";
      out.classList.add("thinking");

      try {
        const res = await fetch("http://127.0.0.1:8000/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q })
        });

        const data = await res.json();
        out.textContent = data.answer.answer;

        out.classList.remove("thinking");
      } catch (err) {
        out.textContent = "System error. Backend not reachable.";
      }
    }
  </script>
</body>
</html>
